[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "prime-ipmi-redfish-bmc"
version = "1.1.0"
description = "Safe Redfish, IPMI, and interactive Serial-over-LAN adapter for Prime/OpenShell"
requires-python = ">=3.10"
dependencies = ["requests>=2.31,<3", "pyte>=0.8.2,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/ipmi_redfish_bmc"]
