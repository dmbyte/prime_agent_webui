[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
# A pre-Prime broker keeps Chromium outside Prime's forked persistent kernel.
name = "prime-bmc-headless-browser"
version = "1.2.0"
description = "Prime/OpenShell browser adapter for BMC web interfaces"
requires-python = ">=3.10"
dependencies = []

[tool.hatch.build.targets.wheel]
packages = ["src/bmc_headless_browser"]
