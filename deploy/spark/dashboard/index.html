<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DGX Spark Prime Console</title><link rel="stylesheet" href="/assets/dashboard.css"><link rel="stylesheet" href="/assets/usage.css"><link rel="stylesheet" href="/assets/activity.css"><link rel="stylesheet" href="/assets/live-console.css"></head>
<body><aside class="sidebar">
<header><span class="status-dot"></span><div><h1>Prime Console</h1><p>DGX Spark · private</p></div><button id="activityToggle" class="activity-toggle" aria-label="Background activity" title="Background activity"><span>◉</span><b id="activityBadge">0</b></button></header>
<section id="monitor" class="monitor" aria-label="System monitor"></section>
<nav><button class="tab active" data-panel="sessions">Conversations</button><button class="tab" data-panel="parameters">Parameters</button><button class="tab" data-panel="usage">Usage</button></nav>
<main><section id="sessions" class="panel active"><button id="newSession" class="primary">＋ New conversation</button><div id="sessionList" class="session-list"></div></section>
<section id="parameters" class="panel"><label>Default model<select id="model"><option value="spark-nemotron/nemotron-3.5-lightning">Nemotron 3.5 + DSpark</option><option value="spark-qwen/qwen3.6-35b-a3b">Qwen 3.6 multimodal</option><option value="openai/gpt-5.4">OpenAI GPT-5.4</option></select></label><label>Thinking level<select id="thinking"><option>off</option><option>minimal</option><option>low</option><option>medium</option><option>high</option><option>xhigh</option><option>max</option></select></label><label>Compaction reserve <output id="reserveValue"></output><input id="reserve" type="range" min="2048" max="32768" step="32"></label><label>Recent context <output id="recentValue"></output><input id="recent" type="range" min="2048" max="32768" step="32"></label><button id="save" class="primary">Save defaults</button><p id="saveStatus" class="muted">Changes apply to new terminal sessions.</p></section>
<section id="usage" class="panel"><div class="usage-head"><span>Provider / model</span><span>Today</span><span>Last 30 days</span></div><div id="usageRows" class="usage-rows"></div><p class="muted">Configured models only. Tokens and recorded API spend; local models are $0.</p></section></main>
<footer><span id="updated">Loading…</span><button id="refresh">Refresh</button></footer></aside><section class="workspace"><iframe id="terminal" title="Prime Agent terminal" src="/terminal/"></iframe></section><section id="activityWindow" class="activity-window" hidden><header id="activityHandle" class="activity-title"><div><strong>Background activity</strong><span id="activitySummary">No active tasks</span></div><button id="activityMinimize" aria-label="Minimize activity window">—</button></header><div class="activity-body"><nav id="activityTabs" class="activity-tabs"></nav><div id="activityPanels" class="activity-panels"></div></div></section><script src="/assets/dashboard.js"></script></body></html>
