version: 1
filesystem_policy:
  include_workdir: true
  read_only:
    - /usr
    - /lib
    - /proc
    - /etc
    - /opt/prime-kernel
    - /run/prime-gateway
  read_write:
    - /home/prime/.prime
    - /project
    - /tmp
    - /dev/null
    - /dev/urandom
    - /dev/random
    - /dev/shm
landlock:
  compatibility: hard_requirement
network_policies: {}
