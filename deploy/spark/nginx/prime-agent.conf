server {
    listen 127.0.0.1:8443 ssl;
    listen 172.16.253.231:8443 ssl;
    server_name localhost spark-c562 172.16.253.231;

    ssl_certificate /etc/nginx/prime-agent-tls/prime-agent.crt;
    ssl_certificate_key /etc/nginx/prime-agent-tls/prime-agent.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_tickets off;

    auth_pam "DGX Spark Prime Agent";
    auth_pam_service_name "prime-agent-nginx";

    # Private clients only. This includes common routed VPN address pools while
    # explicitly denying public source addresses.
    allow 127.0.0.0/8;
    allow 10.0.0.0/8;
    allow 100.64.0.0/10;
    allow 172.16.0.0/12;
    allow 192.168.0.0/16;
    deny all;

    location = /terminal/ws {
        if ($http_origin !~* "^https://(172\.16\.253\.231|127\.0\.0\.1|localhost|spark-c562):8443$") {
            return 403;
        }

        proxy_pass http://127.0.0.1:7681;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_buffering off;
        proxy_read_timeout 7d;
        proxy_send_timeout 7d;
    }

    location /terminal/ {
        proxy_pass http://127.0.0.1:7681;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_buffering off;
        proxy_read_timeout 7d;
        proxy_send_timeout 7d;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8765;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_buffering off;
    }

    location / {
        root /var/www/prime-agent;
        try_files $uri $uri/ /index.html;
    }
}
