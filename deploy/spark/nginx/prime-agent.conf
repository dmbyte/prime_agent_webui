server {
    listen 127.0.0.1:8443 ssl;
    listen 172.16.253.231:8443 ssl;
    server_name localhost spark-c562 172.16.253.231;

    ssl_certificate /etc/nginx/prime-agent-tls/prime-agent.crt;
    ssl_certificate_key /etc/nginx/prime-agent-tls/prime-agent.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_tickets off;
    server_tokens off;
    auth_delay 1s;

    limit_req zone=prime_auth burst=40 nodelay;
    limit_conn prime_addr 20;
    client_header_timeout 15s;
    client_body_timeout 120s;
    keepalive_timeout 30s;
    send_timeout 120s;

    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self' wss:; frame-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'self'; form-action 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header Cache-Control "no-store" always;

    # Private clients only. This includes common routed VPN address pools while
    # explicitly denying public source addresses.
    allow 127.0.0.0/8;
    allow 10.0.0.0/8;
    allow 100.64.0.0/10;
    allow 172.16.0.0/12;
    allow 192.168.0.0/16;
    deny all;

    location = /_auth_check {
        internal;
        proxy_pass http://127.0.0.1:8764/auth/check;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location = /login.html { root /var/www/prime-agent; }
    location = /assets/login.css { root /var/www/prime-agent; }
    location = /assets/login.js { root /var/www/prime-agent; }
    location = /prime-webui-ca.crt { root /var/www/prime-agent; default_type application/x-x509-ca-cert; }

    location /auth/ {
        limit_req zone=prime_auth burst=8 nodelay;
        proxy_pass http://127.0.0.1:8764;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }

    location = /terminal/ws {
        auth_request /_auth_check;
        if ($http_origin !~* "^https://(172\.16\.253\.231|127\.0\.0\.1|localhost|spark-c562):8443$") {
            return 403;
        }

        proxy_pass http://127.0.0.1:7681;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_buffering off;
        proxy_read_timeout 7d;
        proxy_send_timeout 7d;
    }

    location /terminal/ {
        auth_request /_auth_check;
        proxy_pass http://127.0.0.1:7681;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_buffering off;
        proxy_read_timeout 7d;
        proxy_send_timeout 7d;
    }

    location /api/ {
        auth_request /_auth_check;
        auth_request_set $prime_user $upstream_http_x_prime_user;
        auth_request_set $prime_role $upstream_http_x_prime_role;
        client_max_body_size 100m;
        proxy_pass http://127.0.0.1:8765;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Prime-User $prime_user;
        proxy_set_header X-Prime-Role $prime_role;
        proxy_buffering off;
        proxy_request_buffering off;
    }

    location / {
        auth_request /_auth_check;
        error_page 401 =302 /login.html;
        root /var/www/prime-agent;
        try_files $uri $uri/ /index.html;
    }
}
